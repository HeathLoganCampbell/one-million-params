<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#ffffff" />
<title>tiny-gpt — a 1M parameter model in WebAssembly</title>
<link rel="stylesheet" href="vendor/bootstrap.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app d-flex flex-column">

  <header class="border-bottom bg-body">
    <div class="app-width d-flex align-items-baseline justify-content-between py-3">
      <h1 class="h5 mb-0">tiny<em>gpt</em></h1>
      <div class="specs small text-secondary" id="specs">loading…</div>
    </div>
  </header>

  <main class="app-width flex-grow-1 d-flex flex-column">
    <div id="transcript" class="transcript flex-grow-1"></div>

    <form id="composer" class="border-top py-3">
      <textarea id="prompt" class="form-control mb-3" rows="2"
        placeholder="Type some text and press Enter — the model continues it…"></textarea>

      <div class="d-flex align-items-center gap-3 flex-wrap">
        <label class="ctrl small text-secondary">temp
          <input id="temp" type="range" class="form-range" min="0" max="1.5" step="0.05" value="0.85" />
          <span id="tempval">0.85</span>
        </label>
        <label class="ctrl small text-secondary">top-k
          <input id="topk" type="range" class="form-range" min="0" max="256" step="1" value="60" />
          <span id="topkval">60</span>
        </label>
        <label class="ctrl small text-secondary">tokens
          <input id="maxtok" type="number" class="form-control form-control-sm" min="1" max="256" value="120" />
        </label>

        <div class="ms-auto d-flex gap-2">
          <button id="stop" type="button" class="btn btn-outline-secondary btn-sm" hidden>Stop</button>
          <button id="send" type="submit" class="btn btn-primary btn-sm" disabled>Continue</button>
        </div>
      </div>
    </form>
  </main>

  <footer class="border-top bg-body-tertiary">
    <div class="app-width d-flex justify-content-between gap-3 py-2 flex-wrap small text-secondary">
      <span id="status">Loading model…</span>
      <span class="hint">Runs entirely in your browser via WebAssembly. No server, no network calls after load.</span>
    </div>
  </footer>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
