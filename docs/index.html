<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#ffffff" />
<title>one-million-params</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="vendor/bootstrap.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="loader" class="loader">
  <div class="loader-inner">
    <p class="loader-label mb-3">Downloading model weights into your browser…</p>
    <div class="progress" role="progressbar" aria-label="Loading model" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="loadbar" class="progress-bar" style="width: 0%"></div>
    </div>
    <p class="loader-pct mt-2 mb-0"><span id="loadpct">0%</span></p>
  </div>
</div>

<div class="app d-flex flex-column">

  <header class="border-bottom bg-body">
    <div class="app-width d-flex align-items-baseline justify-content-between py-3">
      <h1 class="h5 mb-0">one-million-<em>params</em></h1>
      <div class="specs small text-secondary" id="specs">loading…</div>
    </div>
  </header>

  <main class="app-width flex-grow-1 d-flex flex-column">
    <div id="transcript" class="transcript flex-grow-1"></div>

    <form id="composer" class="border-top py-3">
      <textarea id="prompt" class="form-control mb-3" rows="2"
        placeholder="Type some text and press Enter to continue it…"></textarea>

      <div class="d-flex align-items-center">
        <div class="ms-auto d-flex gap-2">
          <button id="stop" type="button" class="btn btn-outline-secondary btn-sm" hidden>Stop</button>
          <button id="send" type="submit" class="btn btn-primary btn-sm" disabled>Continue</button>
        </div>
      </div>
    </form>
  </main>

  <footer class="border-top bg-body-tertiary">
    <div class="app-width d-flex justify-content-between gap-3 py-2 flex-wrap small text-secondary">
      <span id="status">Loading model…</span>
      <span class="hint">Runs entirely in your browser via WebAssembly. No server, no network calls after load.</span>
    </div>
  </footer>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
